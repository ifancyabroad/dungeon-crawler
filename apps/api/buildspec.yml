version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 20
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile

    build:
        commands:
            - pnpm --filter @app/shared build
            - pnpm --filter @app/content build
            - pnpm --filter @app/api build

    post_build:
        commands:
            # Pack workspace packages as tarballs so npm can install them without pnpm
            - mkdir -p /tmp/packs
            - cd packages/shared && npm pack --pack-destination /tmp/packs && cd ../..
            - cd packages/content && npm pack --pack-destination /tmp/packs && cd ../..
            # Resolve the exact tarball filenames
            - SHARED_TGZ=$(basename $(ls /tmp/packs/app-shared-*.tgz))
            - CONTENT_TGZ=$(basename $(ls /tmp/packs/app-content-*.tgz))
            # Set up the staging directory with compiled output and config
            - mkdir -p eb-staging
            - cp -r apps/api/dist eb-staging/
            - cp apps/api/Procfile eb-staging/
            - cp -r apps/api/.ebextensions eb-staging/
            - cp /tmp/packs/*.tgz eb-staging/
            # Rewrite package.json — replace workspace:* with file: tarball refs, drop devDeps
            - jq --arg shared "file:./$SHARED_TGZ" --arg content "file:./$CONTENT_TGZ" '.dependencies["@app/shared"]=$shared | .dependencies["@app/content"]=$content | del(.devDependencies)' apps/api/package.json > eb-staging/package.json
            # Install production deps using plain npm (no pnpm virtual store / symlinks)
            - cd eb-staging && npm install --omit=dev && cd ..
            # Zip for Elastic Beanstalk
            - cd eb-staging && zip -r ../api-bundle.zip . && cd ..

artifacts:
    files:
        - api-bundle.zip
