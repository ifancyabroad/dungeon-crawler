version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 20
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile

    build:
        commands:
            - pnpm --filter @app/shared build
            - pnpm --filter @app/content build
            - pnpm --filter @app/api build

    post_build:
        commands:
            - mkdir -p eb-staging
            - cp -r apps/api/dist eb-staging/
            - cp apps/api/Procfile eb-staging/
            - cp -r apps/api/.ebextensions eb-staging/

artifacts:
    base-directory: eb-staging
    files:
        - "**/*"
