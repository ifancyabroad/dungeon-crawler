version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 20
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile

    build:
        commands:
            - pnpm --filter @app/shared build
            - pnpm --filter @app/content build
            - pnpm --filter api build

    post_build:
        commands:
            # pnpm deploy creates a self-contained directory with production node_modules,
            # resolving workspace packages (@app/shared, @app/content) with their built dist/
            - pnpm deploy --filter api --prod ./eb-staging
            # Overlay the compiled dist/ — pnpm deploy copies source files, not the build output
            - cp -r apps/api/dist ./eb-staging/
            - cp apps/api/Procfile ./eb-staging/
            - cp -r apps/api/.ebextensions ./eb-staging/
            - cd eb-staging && zip -r ../api-bundle.zip .

artifacts:
    files:
        - api-bundle.zip
