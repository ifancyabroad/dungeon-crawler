version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 20
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile

    build:
        commands:
            - pnpm --filter @app/shared build
            - pnpm --filter @app/content build
            - pnpm --filter @app/api build

    post_build:
        commands:
            # Pack workspace packages as tarballs so npm can install them without pnpm
            - mkdir -p /tmp/packs
            - cd packages/shared && npm pack --pack-destination /tmp/packs && cd ../..
            - cd packages/content && npm pack --pack-destination /tmp/packs && cd ../..
            # Set up the staging directory with compiled output and config
            - mkdir -p eb-staging
            - cp -r apps/api/dist eb-staging/
            - cp apps/api/Procfile eb-staging/
            - cp -r apps/api/.ebextensions eb-staging/
            - cp /tmp/packs/*.tgz eb-staging/
            # Rewrite package.json to replace workspace:* with file: tarball references
            - >
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
                  const tarballs = fs.readdirSync('/tmp/packs');
                  for (const dep of Object.keys(pkg.dependencies || {})) {
                    if (pkg.dependencies[dep].startsWith('workspace:')) {
                      const safeName = dep.replace(/^@/, '').replace('/', '-');
                      const tarball = tarballs.find(t => t.startsWith(safeName));
                      if (tarball) pkg.dependencies[dep] = 'file:./' + tarball;
                    }
                  }
                  delete pkg.devDependencies;
                  fs.writeFileSync('eb-staging/package.json', JSON.stringify(pkg, null, 2));
                "
            # Install production deps using plain npm (no pnpm virtual store / symlinks)
            - cd eb-staging && npm install --production && cd ..
            # Zip for Elastic Beanstalk
            - cd eb-staging && zip -r ../api-bundle.zip . && cd ..

artifacts:
    files:
        - api-bundle.zip
